# ForenSightX Hard-Synthetic Benchmark Configuration
# Iteration 8 Specification Adherence
# All numerical thresholds not present in ForenSightX_Project_Architecture.docx are marked ASSUMPTION.

dataset:
  seed: 42
  total_samples: 1200
  train_ratio: 0.5833333333333334   # 700 cases
  val_ratio: 0.16666666666666666    # 200 cases
  test_ratio: 0.25                  # 300 cases (meets min_test_cases >= 300)
  min_test_cases: 300               # ASSUMPTION-06
  manifest_path: "data/split_manifest_hard_v4.json"
  manifest_path_v4: "data/split_manifest_hard_v4.json"
  min_families_per_split:
    train: 4
    val: 2
    test: 2
  min_families_per_split_v3:
    train: 20
    val: 10
    test: 10
  min_families_per_split_v4:
    train: 30
    val: 15
    test: 15

generator:
  single_feature_auc_cap: 0.85      # ASSUMPTION-07: Maximum allowed univariate test AUC for any heuristic or base feature
  label_noise_rate: 0.05            # ASSUMPTION-08: Label flipping rate
  modality_conflict_rate: 0.05      # ASSUMPTION-09: Uncorrelated cross-modal cue rate
  oracle_fused_margin: 0.05         # Fused oracle must exceed best single modality by at least 0.05
  train_template_families:
    - "invoice_payment"
    - "account_suspension"
    - "urgent_wire"
    - "meeting_reschedule"
    - "project_status"
    - "executive_travel"
    - "vendor_onboarding"
    - "payroll_discrepancy"
    - "tax_compliance"
    - "legal_subpoena"
    - "system_alert"
    - "domain_renewal"
    - "audit_request"
    - "quarterly_budget"
    - "facility_maintenance"
    - "office_relocation"
    - "contract_amendment"
    - "procurement_order"
    - "customer_complaint"
    - "press_release"
  val_template_families:
    - "it_support_ticket"
    - "hr_benefit_update"
    - "cloud_access_request"
    - "software_license"
    - "data_backup_notice"
    - "training_seminar"
    - "telecom_bill"
    - "travel_expense_report"
    - "security_incident_report"
    - "marketing_campaign"
  test_template_families:
    - "shipping_delivery_notice"
    - "vpn_credential_update"
    - "conference_invitation"
    - "patent_filing_notice"
    - "regulatory_disclosure"
    - "board_meeting_agenda"
    - "supply_chain_dispatch"
    - "charity_donation_match"
    - "health_safety_inspection"
    - "infrastructure_upgrade"

oof:
  tolerance: 0.05                   # ASSUMPTION-14: Max allowed difference between OOF AUC and Val AUC

grid:
  negative_control_lr: 2.0          # Negative control LR expected to fail/saturate
  saturation_threshold: 0.95        # Fraction of outputs within [0, 0.05] or [0.95, 1.0]

vae_repair:
  latent_dim: 4                     # ASSUMPTION-11
  hidden_dim: 32                    # ASSUMPTION-11
  epochs: 30                        # ASSUMPTION-11
  kl_warmup_epochs: 15              # ASSUMPTION-11: Linear beta warmup from 0.0 to 1.0
  free_bits: 0.1                    # ASSUMPTION-11: Minimum nats per dimension before penalty
  per_dim_kl_threshold: 0.05        # ASSUMPTION-13: Minimum KL to avoid collapse
  two_sided_ratio_min: 0.5          # ASSUMPTION-15: Minimum synthetic-to-real std ratio
  two_sided_ratio_max: 2.0          # ASSUMPTION-15: Maximum synthetic-to-real std ratio
  wasserstein_ratio_max: 0.50       # ASSUMPTION-16: Maximum Wasserstein / real std ratio
  discriminator_auc_max: 0.85       # Real vs synthetic indistinguishability cap

experiments:
  n_seeds: 10                       # Rule G14: Seeds for Experiments A-E
  bootstrap_replicates: 1000
  ci_confidence_level: 0.95
  global_permutation_seeds: 100
  synthetic_ratio_sweep: [0.0, 0.25, 0.50, 1.00]
