# ForenSightX Hard-Synthetic Benchmark Configuration
# Iteration 6 Specification Adherence
# All numerical thresholds not present in ForenSightX_Project_Architecture.docx are marked ASSUMPTION.

dataset:
  seed: 42
  total_samples: 1200
  train_ratio: 0.5833333333333334   # 700 cases
  val_ratio: 0.16666666666666666    # 200 cases
  test_ratio: 0.25                  # 300 cases (meets min_test_cases >= 300)
  min_test_cases: 300               # ASSUMPTION-06
  manifest_path: "data/split_manifest_hard_v1.json"

generator:
  single_feature_auc_cap: 0.85      # ASSUMPTION-07: Maximum allowed univariate test AUC for any heuristic or base feature
  label_noise_rate: 0.05            # ASSUMPTION-08: Label flipping rate
  modality_conflict_rate: 0.05      # ASSUMPTION-09: Uncorrelated cross-modal cue rate
  held_out_test_template_families:  # Unseen in train/val
    - "shipping_delivery_notice"
    - "vpn_credential_update"
    - "conference_invitation"
  train_val_template_families:
    - "invoice_payment"
    - "account_suspension"
    - "urgent_wire"
    - "meeting_reschedule"
    - "project_status"

vae_repair:
  latent_dim: 4                     # ASSUMPTION-11
  hidden_dim: 32                    # ASSUMPTION-11
  epochs: 30                        # ASSUMPTION-11
  kl_warmup_epochs: 15              # ASSUMPTION-11: Linear beta warmup from 0.0 to 1.0
  free_bits: 0.1                    # ASSUMPTION-11: Minimum nats per dimension before penalty
  per_dim_kl_threshold: 0.05        # ASSUMPTION-13: Minimum KL to avoid collapse
  decoder_std_ratio_threshold: 0.15 # ASSUMPTION-12: Synthetic-to-real std ratio threshold
  discriminator_auc_max: 0.85       # Real vs synthetic indistinguishability cap

experiments:
  n_seeds: 5                        # Seeds for Experiments A-E
  bootstrap_replicates: 1000
  ci_confidence_level: 0.95
  global_permutation_seeds: 100
  synthetic_ratio_sweep: [0.0, 0.25, 0.50, 1.00]

